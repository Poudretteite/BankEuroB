name: bankeurob

# ============================================================
# BankEuroB – Główny system bankowości internetowej
# ============================================================
# Uruchamia tylko podstawowe usługi BankEuroB:
#   - PostgreSQL (baza danych)
#   - pgAdmin (panel zarządzania bazą)
#   - RabbitMQ (messaging)
#   - Backend (Spring Boot)
#   - Frontend (React + Vite)
#
# Systemy płatnicze są uruchamiane osobno w swoich folderach:
#   - eu-payments-units/docker-compose.yml
#   - Karty-Platnicze-Aplikacje-Biznesowe/docker-compose.yaml
#   - KLIK-payments/docker-compose.yml
#   - SWIFT-Aplikacje-Biznesowe/docker-compose.yml
# ============================================================

services:
  # ─────────────────────────────────────────────────
  # PostgreSQL – główna baza danych BankEuroB
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bankeurob-postgres
    restart: unless-stopped
    environment:
      KLIK_API_KEY: klik_776d015433da425cae6d89576e3cc416
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bankeurob-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────
  # pgAdmin – webowy panel do zarządzania bazą
  # Dostęp: http://localhost:5050
  # ─────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bankeurob-pgadmin
    restart: unless-stopped
    environment:
      KLIK_API_KEY: klik_776d015433da425cae6d89576e3cc416
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bankeurob-net

  # ─────────────────────────────────────────────────
  # RabbitMQ – messaging dla transakcji asynchronicznych
  # Panel: http://localhost:15672  login: guest / guest
  # ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bankeurob-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    networks:
      - bankeurob-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────
  # Backend – Spring Boot
  # ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bankeurob-backend
    restart: unless-stopped
    environment:
      KLIK_API_KEY: klik_776d015433da425cae6d89576e3cc416
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      # Integracja z systemami płatniczymi – adresy w sieci Docker
      # Spring Boot relaxed binding: integration.target.base-url → INTEGRATION_TARGET_BASEURL
      INTEGRATION_TARGET_BASEURL: http://target-service:8001
      INTEGRATION_SEPA_BATCH_BASEURL: http://sepa-batch-service:8002
      INTEGRATION_SEPA_INSTANT_BASEURL: http://sepa-instant-service:8003
      INTEGRATION_SWIFT_BASEURL: http://swift-app:3000
      INTEGRATION_CARDS_GATEWAY_BASEURL: http://cards-gateway-app:8000
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bankeurob-net
      - bankeurob-unified-net

  # ─────────────────────────────────────────────────
  # Frontend – React (Vite)
  # ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bankeurob-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - bankeurob-net

volumes:
  postgres_data:
    driver: local

networks:
  bankeurob-net:
    driver: bridge
  bankeurob-unified-net:
    external: true






